services:
  agents:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent_loop
    volumes:
      # 整個工作區根目錄用「與 host 相同的絕對路徑」掛載（而非重新映射到 /workspace/...）。
      # 原因：容器內執行的 docker compose 是透過下方 docker.sock 操控 host 上同一顆
      # daemon，daemon 建立目標專案的 bind mount 時，用的是這裡掛載路徑本身的字串，
      # 該路徑必須在 host 上真實存在，否則會掛載到空目錄。
      # 改掛整個根目錄（而非只掛 AgentLoop/ 與單一 TARGET_PROJECT）是為了讓網頁控制台
      # 能切換目標專案、用資料夾選擇器看到其他專案，不需要為此重建容器。
      - ${HOST_WORKSPACE_ROOT}:${HOST_WORKSPACE_ROOT}
      # 讓容器內的 docker CLI 操控 host 的 docker engine（Docker outside of Docker）
      - /var/run/docker.sock:/var/run/docker.sock
      # 容器專屬的 Claude Code 登入狀態（.claude/ 其餘內容、.claude.json 等），
      # 存在獨立的 named volume，刻意不與 host 的 ~/.claude 共用。
      # 原因：host 若同時在跑 claude，跟容器內的 claude subprocess 共用同一份憑證檔，
      # OAuth token refresh 會互相搶寫，導致容器執行到一半認證失效報錯，
      # 或剛啟動時讀到寫入中的檔案而顯示未登入。首次使用建議在 host 執行
      # `claude setup-token`，把產出的 token 寫進 .env 的 CLAUDE_CODE_OAUTH_TOKEN
      # （或改設 ANTHROPIC_API_KEY），細節見 README；容器內互動式 `claude login`
      # 仍可用但不是首選，因為 docker exec -it 的嵌套 TTY 貼授權碼常顯示 Invalid code
      - agent_home:/home/agent
      # skills 內容維持從 host 讀取，僅唯讀掛載——純靜態內容，不受上面的憑證 race 影響
      - ${HOME}/.claude/skills:/home/agent/.claude/skills:ro
      # ~/.claude/skills 底下多為指向 ~/.agents/skills 的符號連結，需一併掛載才能解析
      - ${HOME}/.agents:/home/agent/.agents:ro
    env_file:
      - .env
    # 停在 AgentLoop 的上層目錄，讓 `python -m AgentLoop.main ...` 能把 AgentLoop
    # 當成頂層 package 解析（原本掛在 /workspace/agentloop 時也是靠 working_dir
    # 停在其上層 /workspace 達成同樣效果）
    working_dir: ${HOST_WORKSPACE_ROOT}
    # 網頁控制台只綁 host 的 127.0.0.1，不對外開放；容器內監聽 0.0.0.0:8000 讓
    # uvicorn 能被上面這層的 127.0.0.1 轉送到。前端用映像裡的建置產物（WEB_DIST_DIR）。
    ports:
      - "127.0.0.1:8000:8000"
    command: python -m uvicorn AgentLoop.web.app:app --host 0.0.0.0 --port 8000

volumes:
  agent_home:
